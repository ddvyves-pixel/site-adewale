<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEWALE — Prise de Consultation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --nuit:#DAD4C6;
    --ebene:#EDEAE3;
    --terracotta:#C1562D;
    --or:#A9822E;
    --cauri:#241F1A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}

  /* ARRIÈRE-PLAN AVEC VOTRE IMAGE LOCALE */
  body{
    background:var(--ebene);
    color:var(--cauri);
    font-family:'Manrope',sans-serif;
    overflow-x:hidden;
    cursor:none;
    position: relative;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(rgba(237, 234, 227, 0.88), rgba(237, 234, 227, 0.88)),
                url('images/consultation-bg.jpg') center/cover no-repeat;
    z-index: -1;
  }

  ::selection{background:var(--terracotta);color:var(--cauri);}

  /* RIDEAU DE TRANSITION */
  #curtain {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background-color: var(--cauri);
    z-index: 99999;
    transform: translateY(-100%);
    pointer-events: none;
  }

  /* CURSEUR */
  #cursor{
    position:fixed;
    width:14px;height:14px;
    border:1.5px solid var(--or);
    border-radius:2px;
    transform:rotate(45deg);
    pointer-events:none;
    z-index:9998;
    transition:transform .3s ease;
    mix-blend-mode:difference;
  }
  #cursor.hover{transform:rotate(45deg) scale(1.8);}

  @media (hover: none) and (pointer: coarse) {
    body { cursor: auto; }
    #cursor { display: none; }
  }

  /* NAVIGATION */
  nav{
    position:fixed;top:0;left:0;width:100%;
    display:flex;justify-content:space-between;align-items:center;
    padding:28px 48px;z-index:100;
    background:rgba(237,234,227,0.85);
    backdrop-filter:blur(10px);
  }
  nav .logo{font-family:'Fraunces',serif;font-size:20px;color:var(--cauri);text-decoration:none;}
  nav ul{list-style:none;display:flex;gap:36px;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;}
  nav a{color:var(--cauri);text-decoration:none;}
  nav a.active, nav a:hover{color:var(--terracotta);}

  main{
    max-width:700px;
    margin:0 auto;
    padding:160px 24px 80px 24px;
  }

  .eyebrow{font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--terracotta);margin-bottom:20px;}
  h1{font-family:'Fraunces',serif;font-size:clamp(40px,6vw,72px);line-height:1.05;margin-bottom:32px;}
  .intro{font-size:18px;line-height:1.6;color:rgba(36,31,26,0.85);font-weight:300;margin-bottom:40px;}

  form{
    display:flex;flex-direction:column;gap:24px;
    background:rgba(237,234,227,0.6);
    padding:32px;
    border:1px solid rgba(169,130,46,0.25);
    backdrop-filter:blur(5px);
  }
  .form-group{display:flex;flex-direction:column;gap:8px;}
  label{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--or);}
  input, select, textarea{
    width:100%;padding:16px;
    background:rgba(255,255,255,0.4);
    border:1px solid rgba(36,31,26,0.2);border-radius:2px;
    color:var(--cauri);font-family:'Manrope',sans-serif;font-size:15px;outline:none;
    transition:border-color .3s, background .3s;
  }
  input:focus, select:focus, textarea:focus{
    border-color:var(--terracotta);
    background:rgba(255,255,255,0.7);
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    margin-top:16px;padding:18px 36px;background:var(--terracotta);color:var(--ebene);
    border:none;border-radius:2px;font-family:'Manrope',sans-serif;font-size:14px;
    letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;transition:background .3s;
  }
  .btn:hover{background:var(--cauri);}

  @media (max-width:768px){
    nav{padding:20px 24px;}
    nav ul{display:none;}
  }
</style>
</head>
<body>

<div id="curtain"></div>
<div id="cursor"></div>

<nav>
  <a href="index.html" class="logo">ADEWALE</a>
  <ul>
    <li><a href="savoir.html">Le savoir</a></li>
    <li><a href="lecture.html">La lecture</a></li>
    <li><a href="temoignages.html">Témoignages</a></li>
    <li><a href="consultation.html" class="active">Consultation</a></li>
  </ul>
</nav>

<main>
  <div class="eyebrow">Prendre Rendez-vous</div>
  <h1>Le plateau attend votre question</h1>
  <p class="intro">
    Remplissez le formulaire ci-dessous pour réserver une séance individuelle avec ADEWALE. Vous recevrez une confirmation sous 24h.
  </p>

  <form onsubmit="event.preventDefault(); alert('Votre demande a bien été envoyée.');">
    <div class="form-group">
      <label for="nom">Nom Complet</label>
      <input type="text" id="nom" placeholder="Votre nom" required>
    </div>
    <div class="form-group">
      <label for="email">Adresse E-mail</label>
      <input type="email" id="email" placeholder="votre.email@exemple.com" required>
    </div>
    <div class="form-group">
      <label for="type">Format de la séance</label>
      <select id="type" required>
        <option value="presence">En présence (Abomey-Calavi / Cotonou)</option>
        <option value="distance">A distance (Appel vidéo / Téléphone)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="message">Sujet principal ou préoccupation (optionnel)</label>
      <textarea id="message" rows="5" placeholder="Décrivez brièvement le domaine sur lequel vous souhaitez de la clarté..."></textarea>
    </div>
    <button type="submit" class="btn">Soumettre la demande</button>
  </form>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const curtain = document.getElementById('curtain');
  gsap.fromTo(curtain, { translateY: "0%" }, { translateY: "-100%", duration: 0.8, ease: "power3.inOut" });

  document.querySelectorAll('a[href$=".html"]').forEach(link => {
    link.addEventListener('click', (e) => {
      const targetUrl = link.getAttribute('href');
      if (targetUrl === window.location.pathname.split('/').pop()) return;
      e.preventDefault();
      gsap.to(curtain, {
        translateY: "0%", duration: 0.6, ease: "power3.inOut",
        onComplete: () => { window.location.href = targetUrl; }
      });
    });
  });
});

const cursor = document.getElementById('cursor');
if (window.matchMedia('(hover: hover)').matches) {
  window.addEventListener('mousemove', e => {
    gsap.to(cursor, {x: e.clientX - 7, y: e.clientY - 7, duration: 0.15, ease: 'power2.out'});
  });
  document.querySelectorAll('a, button, input, select, textarea').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
}
</script>
</body>
</html>
